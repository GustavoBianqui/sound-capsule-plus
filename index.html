<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Sound Capsule+</title>

<style>
:root {
  --bg:#121212;
  --card:#242424;
  --green:#1ed760;
  --text:#fff;
  --muted:#b3b3b3;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button {
  font:inherit;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

button:focus-visible {
  outline:2px solid var(--green);
  outline-offset:3px;
}

header,main {
  max-width:700px;
  margin:auto;
  padding-left:18px;
  padding-right:18px;
}

header { padding-top:28px; }
main { padding-bottom:125px; }

h1 {
  margin:0 0 6px;
  font-size:27px;
}

h2 {
  margin:25px 0 13px;
  font-size:20px;
}

.subtitle {
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.auth-bar {
  display:flex;
  align-items:center;
  gap:12px;
  margin:21px 0 27px;
}

.status {
  color:var(--muted);
  font-size:12px;
  flex:1;
}

.spotify-btn {
  border:0;
  border-radius:30px;
  padding:11px 17px;
  background:var(--green);
  color:#000;
  font-size:13px;
  font-weight:700;
}

.exit-btn {
  border:1px solid #383838;
  border-radius:30px;
  padding:7px 13px;
  background:#292929;
  color:#bbb;
  font-size:12px;
}

.mode-switch,.tabs {
  display:flex;
  gap:9px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:4px;
}

.mode-switch::-webkit-scrollbar,
.tabs::-webkit-scrollbar {
  display:none;
}

.mode-switch { margin-bottom:13px; }
.tabs { margin:21px 0 22px; }

.pill {
  flex-shrink:0;
  border:0;
  border-radius:30px;
  background:#292929;
  color:white;
  padding:11px 15px;
  font-size:13px;
  white-space:nowrap;
}

.pill.active {
  background:var(--green);
  color:#000;
  font-weight:700;
}

.month-selector {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:20px 0;
}

.month-selector strong {
  text-align:center;
  font-size:17px;
}

.arrow {
  border:0;
  border-radius:30px;
  background:#333;
  color:white;
  padding:9px 16px;
}

.card {
  background:var(--card);
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
}

.label {
  color:var(--muted);
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:1px;
}

.big-number {
  margin-top:9px;
  color:var(--green);
  font-size:42px;
  font-weight:800;
}

.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.favorite {
  min-height:160px;
  overflow:hidden;
  cursor:pointer;
}

.favorite strong {
  display:block;
  overflow-wrap:anywhere;
  font-size:15px;
  line-height:1.4;
}

.favorite-image {
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:12px;
  display:block;
  margin:15px 0 10px;
}

.favorite-image.artist { border-radius:50%; }

.emoji {
  font-size:40px;
  margin:17px 0;
}

.blue { color:#8bc5ff; }
.yellow { color:#ffe17d; }

.rank-item {
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid #363636;
}

.rank-item:last-child { border-bottom:0; }

.rank-number {
  width:25px;
  color:var(--muted);
  flex-shrink:0;
}

.rank-icon {
  width:48px;
  height:48px;
  border-radius:50%;
  background:#414141;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.rank-icon.square { border-radius:8px; }

.rank-icon img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.rank-info {
  flex:1;
  min-width:0;
}

.rank-info strong {
  display:block;
  font-size:14px;
  overflow-wrap:anywhere;
}

.rank-info small {
  display:block;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin-top:4px;
}

.notice {
  position:relative;
  padding:15px 43px 15px 15px;
  margin-bottom:16px;
  border-radius:13px;
  background:#19251e;
  border:1px solid #35503e;
  font-size:12px;
  line-height:1.6;
}

.notice.error {
  background:#301d1d;
  border-color:#784343;
  color:#ffd4d4;
}

.notice-close {
  position:absolute;
  top:7px;
  right:8px;
  width:28px;
  height:28px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#bbb;
  font-size:20px;
}

.empty {
  padding:25px 8px;
  color:var(--muted);
  text-align:center;
  font-size:14px;
  line-height:1.7;
}

.year-row {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:22px;
  margin:25px 0;
}

.month-grid {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.month-tile {
  border:1px solid #444;
  border-radius:13px;
  padding:17px 5px;
  background:#292929;
  color:white;
}

.month-tile.available { border-color:var(--green); }

.month-tile small {
  display:block;
  margin-top:7px;
  font-size:10px;
  color:#aaa;
}

.upload-box {
  border:1px dashed #666;
  border-radius:17px;
  padding:22px;
  text-align:center;
  background:#1b1b1b;
  margin-bottom:18px;
}

.upload-box p {
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.upload-btn {
  display:inline-block;
  border:0;
  border-radius:30px;
  padding:12px 18px;
  background:var(--green);
  color:black;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.upload-btn:disabled {
  opacity:.5;
  cursor:wait;
}

.danger-btn {
  background:#372424;
  border:1px solid #704040;
  border-radius:30px;
  color:#ffbaba;
  padding:9px 13px;
  font-size:12px;
}

.stat-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:15px;
}

.stat {
  padding:17px;
  border-radius:13px;
  background:#292929;
}

.stat strong {
  display:block;
  color:var(--green);
  font-size:23px;
  overflow-wrap:anywhere;
}

.stat span {
  color:var(--muted);
  font-size:11px;
}

.progress-container {
  margin-top:20px;
  text-align:left;
}

.progress-bar {
  width:100%;
  height:9px;
  border-radius:10px;
  background:#333;
  overflow:hidden;
  margin:12px 0;
}

.progress-fill {
  width:0%;
  height:100%;
  background:var(--green);
  transition:width .2s;
}

.progress-text {
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}

.bottom-nav {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:10;
  display:flex;
  justify-content:space-around;
  background:#080808;
  border-top:1px solid #333;
  padding:12px 4px max(18px,env(safe-area-inset-bottom));
}

.bottom-nav button {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  border:0;
  background:none;
  color:var(--muted);
  font-size:11px;
}

.bottom-nav button.active { color:var(--green); }
.bottom-nav .icon { font-size:23px; }

.hidden { display:none!important; }

@media(max-width:360px) {
  .pill { padding:10px 12px; font-size:12px; }
  .card { padding:16px; }
  .favorite strong { font-size:14px; }
}
</style>
</head>

<body>

<header>
  <h1>Sound Capsule+ 💚</h1>
  <div class="subtitle">Sua história musical, mês a mês.</div>

  <div class="auth-bar">
    <button
      class="spotify-btn"
      id="connectBtn"
      onclick="connectSpotify()">
      Conectar com Spotify
    </button>

    <span class="status" id="authStatus">
      Modo histórico
    </span>

    <button
      class="exit-btn hidden"
      id="disconnectBtn"
      onclick="disconnectSpotify()">
      Sair
    </button>
  </div>
</header>

<main>

  <div id="controls"></div>

  <div class="month-selector hidden" id="monthSelector">
    <button class="arrow" onclick="changeMonth(-1)">‹</button>
    <strong id="monthTitle"></strong>
    <button class="arrow" onclick="changeMonth(1)">›</button>
  </div>

  <div class="tabs hidden" id="tabs">
    <button class="pill" data-tab="overview" onclick="setTab('overview')">
      Visão geral
    </button>
    <button class="pill" data-tab="artists" onclick="setTab('artists')">
      Artistas
    </button>
    <button class="pill" data-tab="songs" onclick="setTab('songs')">
      Músicas
    </button>
  </div>

  <div id="messages"></div>
  <div id="content"></div>

</main>

<nav class="bottom-nav" id="bottomNav"></nav>

<input
  type="file"
  id="historyFiles"
  accept=".zip,.json,application/zip,application/json"
  multiple
  hidden
  onchange="importHistory(event)"
>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script>

/* ======================================
   CONFIGURAÇÕES
====================================== */

const CLIENT_ID =
  "6075f18370344faeb7af4270b39823db";

const REDIRECT_URI =
  "https://gustavobianqui.github.io/sound-capsule-plus/";

const SCOPES = "user-top-read";

const AUTH_KEY = "sound_capsule_auth";
const CACHE_KEY = "sound_capsule_api_cache";
const CACHE_DURATION = 60 * 60 * 1000;

const DB_NAME = "sound_capsule_database";
const DB_VERSION = 1;
const STORE_NAME = "history";

/* ======================================
   ESTADO
====================================== */

const $ = id => document.getElementById(id);

const months = [
  "Janeiro","Fevereiro","Março",
  "Abril","Maio","Junho",
  "Julho","Agosto","Setembro",
  "Outubro","Novembro","Dezembro"
];

let auth = loadAuth();

let source = auth ? "spotify" : "history";
let range = "short_term";

let currentPage = "home";
let currentTab = "overview";

let selectedMonth = "2024-09";
let historyYear = 2024;

let spotifyArtists = [];
let spotifySongs = [];

let listeningHistory = [];
let importedCount = 0;

let dismissedNotices = new Set();
let currentMessage = null;

let loadingSpotify = false;
let spotifyRequestId = 0;

let importing = false;
let importProgress = 0;
let importStatus = "";

/* ======================================
   UTILITÁRIOS
====================================== */

function escapeHTML(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    })[c]
  );
}

function safeImage(url) {
  if (!url) return "";

  try {
    const parsed = new URL(url);

    return parsed.protocol === "https:"
      ? escapeHTML(parsed.href)
      : "";
  } catch {
    return "";
  }
}

function number(value) {
  return Math.round(value).toLocaleString("pt-BR");
}

function minutes(ms) {
  return Math.round(ms / 60000);
}

function monthName(key) {
  const [year,month] = key.split("-").map(Number);
  return months[month-1] + " " + year;
}

function noticeHTML(id,text,error=false) {
  if (dismissedNotices.has(id)) return "";

  return `
    <div class="notice ${error?"error":""}">
      <button
        class="notice-close"
        onclick="dismissNotice('${id}')"
        aria-label="Fechar aviso">×</button>
      ${escapeHTML(text)}
    </div>
  `;
}

function dismissNotice(id) {
  dismissedNotices.add(id);

  if (currentMessage?.id === id) {
    currentMessage = null;
  }

  render();
}

function notify(text,error=false) {
  currentMessage = text
    ? {
        id:"message_"+Date.now(),
        text,
        error
      }
    : null;

  renderMessages();
}

function renderMessages() {
  $("messages").innerHTML = currentMessage
    ? noticeHTML(
        currentMessage.id,
        currentMessage.text,
        currentMessage.error
      )
    : "";
}

function sleepFrame() {
  return new Promise(resolve => setTimeout(resolve,0));
}

/* ======================================
   AUTENTICAÇÃO SPOTIFY
====================================== */

function loadAuth() {
  try {
    return JSON.parse(
      sessionStorage.getItem(AUTH_KEY) || "null"
    );
  } catch {
    return null;
  }
}

function saveAuth(data) {
  auth = data;

  if (data) {
    sessionStorage.setItem(
      AUTH_KEY,
      JSON.stringify(data)
    );
  } else {
    sessionStorage.removeItem(AUTH_KEY);
  }
}

function randomString() {
  const bytes = crypto.getRandomValues(
    new Uint8Array(64)
  );

  return Array.from(
    bytes,
    b => b.toString(16).padStart(2,"0")
  ).join("");
}

async function challengeFor(verifier) {
  const bytes = new TextEncoder().encode(verifier);

  const hash = await crypto.subtle.digest(
    "SHA-256",
    bytes
  );

  return btoa(
    String.fromCharCode(...new Uint8Array(hash))
  )
  .replace(/\+/g,"-")
  .replace(/\//g,"_")
  .replace(/=+$/,"");
}

async function connectSpotify() {
  try {
    const verifier = randomString();
    const state = randomString();

    sessionStorage.setItem(
      "spotify_verifier",
      verifier
    );

    sessionStorage.setItem(
      "spotify_state",
      state
    );

    const challenge = await challengeFor(verifier);

    const params = new URLSearchParams({
      client_id:CLIENT_ID,
      response_type:"code",
      redirect_uri:REDIRECT_URI,
      scope:SCOPES,
      code_challenge_method:"S256",
      code_challenge:challenge,
      state
    });

    location.href =
      "https://accounts.spotify.com/authorize?" +
      params.toString();

  } catch(error) {
    notify("Erro na conexão: "+error.message,true);
  }
}

async function tokenRequest(params) {
  const response = await fetch(
    "https://accounts.spotify.com/api/token",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/x-www-form-urlencoded"
      },
      body:new URLSearchParams(params)
    }
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error(
      data.error_description ||
      data.error ||
      "Erro de autenticação"
    );
  }

  return data;
}

async function handleCallback() {
  const query = new URLSearchParams(location.search);

  if (!query.has("code") && !query.has("error")) {
    return;
  }

  const code = query.get("code");
  const state = query.get("state");
  const error = query.get("error");

  history.replaceState(
    {},
    "",
    location.pathname
  );

  if (error) {
    notify("Autorização recusada: "+error,true);
    return;
  }

  const verifier =
    sessionStorage.getItem("spotify_verifier");

  const expectedState =
    sessionStorage.getItem("spotify_state");

  sessionStorage.removeItem("spotify_verifier");
  sessionStorage.removeItem("spotify_state");

  if (!verifier || !expectedState || state !== expectedState) {
    notify("Falha na verificação de segurança.",true);
    return;
  }

  try {
    const token = await tokenRequest({
      client_id:CLIENT_ID,
      grant_type:"authorization_code",
      code,
      redirect_uri:REDIRECT_URI,
      code_verifier:verifier
    });

    saveAuth({
      ...token,
      expires_at:Date.now()+token.expires_in*1000
    });

    source = "spotify";
    notify("Spotify conectado com sucesso!");

  } catch(error) {
    notify("Erro ao conectar: "+error.message,true);
  }
}

async function validToken() {
  if (!auth) throw new Error("Spotify não conectado.");

  if (Date.now() < auth.expires_at-60000) {
    return auth.access_token;
  }

  if (!auth.refresh_token) {
    throw new Error("Sessão expirada. Conecte novamente.");
  }

  const refreshed = await tokenRequest({
    client_id:CLIENT_ID,
    grant_type:"refresh_token",
    refresh_token:auth.refresh_token
  });

  saveAuth({
    ...auth,
    ...refreshed,
    refresh_token:
      refreshed.refresh_token || auth.refresh_token,
    expires_at:Date.now()+refreshed.expires_in*1000
  });

  return auth.access_token;
}

async function spotifyAPI(endpoint) {
  const token = await validToken();

  const response = await fetch(
    "https://api.spotify.com/v1/"+endpoint,
    {
      headers:{
        Authorization:"Bearer "+token
      }
    }
  );

  if (!response.ok) {
    let data = {};

    try {
      data = await response.json();
    } catch {}

    throw new Error(
      data.error?.message ||
      "Erro HTTP "+response.status
    );
  }

  return response.json();
}

function disconnectSpotify() {
  spotifyRequestId++;
  saveAuth(null);

  sessionStorage.removeItem(CACHE_KEY);

  spotifyArtists = [];
  spotifySongs = [];

  source = "history";
  currentPage = "home";

  notify("Spotify desconectado.");
  render();
}

/* ======================================
   CACHE DA API
====================================== */

function readCache() {
  try {
    return JSON.parse(
      sessionStorage.getItem(CACHE_KEY) || "{}"
    );
  } catch {
    return {};
  }
}

function cachedRange(selectedRange) {
  const cache = readCache();
  const entry = cache[selectedRange];

  if (!entry) return null;

  if (Date.now()-entry.savedAt > CACHE_DURATION) {
    return null;
  }

  return entry;
}

function saveCache(selectedRange,artists,songs) {
  const cache = readCache();

  cache[selectedRange] = {
    savedAt:Date.now(),
    artists,
    songs
  };

  try {
    sessionStorage.setItem(
      CACHE_KEY,
      JSON.stringify(cache)
    );
  } catch {}
}

async function loadSpotifyData() {
  if (!auth) return;

  const requestedRange = range;
  const requestId = ++spotifyRequestId;

  const cached = cachedRange(requestedRange);

  if (cached) {
    spotifyArtists = cached.artists;
    spotifySongs = cached.songs;
    loadingSpotify = false;
    render();
    return;
  }

  loadingSpotify = true;
  render();

  try {
    const [artists,songs] = await Promise.all([
      spotifyAPI(
        "me/top/artists?time_range="+
        requestedRange+"&limit=50"
      ),
      spotifyAPI(
        "me/top/tracks?time_range="+
        requestedRange+"&limit=50"
      )
    ]);

    if (requestId !== spotifyRequestId) return;

    spotifyArtists = artists.items || [];
    spotifySongs = songs.items || [];

    saveCache(
      requestedRange,
      spotifyArtists,
      spotifySongs
    );

  } catch(error) {
    if (requestId !== spotifyRequestId) return;

    spotifyArtists = [];
    spotifySongs = [];

    notify(
      "Não foi possível carregar os rankings: "+
      error.message,
      true
    );

  } finally {
    if (requestId === spotifyRequestId) {
      loadingSpotify = false;
      render();
    }
  }
}

/* ======================================
   BANCO DE DADOS LOCAL
====================================== */

function openDatabase() {
  return new Promise((resolve,reject) => {
    const request = indexedDB.open(
      DB_NAME,
      DB_VERSION
    );

    request.onupgradeneeded = () => {
      const db = request.result;

      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME,{
          keyPath:"id"
        });
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function saveHistoryBatch(records) {
  if (!records.length) return;

  const db = await openDatabase();

  try {
    await new Promise((resolve,reject) => {
      const tx = db.transaction(
        STORE_NAME,
        "readwrite"
      );

      const store = tx.objectStore(STORE_NAME);

      for (const record of records) {
        store.put(record);
      }

      tx.oncomplete = resolve;
      tx.onerror = () => reject(
        tx.error || new Error("Falha ao salvar histórico")
      );
      tx.onabort = () => reject(
        tx.error || new Error("Gravação interrompida")
      );
    });
  } finally {
    db.close();
  }
}

async function loadHistory() {
  const db = await openDatabase();

  try {
    const records = await new Promise((resolve,reject) => {
      const tx = db.transaction(
        STORE_NAME,
        "readonly"
      );

      const request =
        tx.objectStore(STORE_NAME).getAll();

      request.onsuccess = () => resolve(request.result || []);
      request.onerror = () => reject(request.error);
    });

    listeningHistory = records;
    importedCount = records.length;

  } finally {
    db.close();
  }
}

async function clearHistory() {
  if (importing) return;

  if (!confirm(
    "Apagar todo o histórico importado deste navegador?"
  )) return;

  const db = await openDatabase();

  try {
    await new Promise((resolve,reject) => {
      const tx = db.transaction(
        STORE_NAME,
        "readwrite"
      );

      tx.objectStore(STORE_NAME).clear();

      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });

    listeningHistory = [];
    importedCount = 0;

    notify("Histórico local apagado.");
    render();

  } finally {
    db.close();
  }
}

/* ======================================
   NORMALIZAÇÃO DOS REGISTROS
====================================== */

function normalizeRecord(item) {
  if (!item || typeof item !== "object") return null;

  const dateText = item.ts || item.endTime;

  if (!dateText) return null;

  let date;

  if (item.ts) {
    date = new Date(item.ts);
  } else {
    date = new Date(
      item.endTime.replace(" ","T")+"Z"
    );
  }

  if (isNaN(date.getTime())) return null;

  const artist =
    item.master_metadata_album_artist_name ||
    item.artistName ||
    "";

  const track =
    item.master_metadata_track_name ||
    item.trackName ||
    "";

  const album =
    item.master_metadata_album_album_name ||
    "";

  const ms = Number(
    item.ms_played ?? item.msPlayed ?? 0
  );

  if (!artist || !track) return null;
  if (!Number.isFinite(ms) || ms <= 0) return null;

  const timestamp = date.toISOString();

  const uri =
    item.spotify_track_uri || "";

  /*
    Não armazenamos:
    - Endereço IP
    - País de conexão
    - Plataforma
    - Identificadores de dispositivos

    Guardamos apenas informações musicais.
  */

  const id = [
    timestamp,
    uri || artist+"|"+track,
    ms
  ].join("|");

  return {
    id,
    timestamp,
    month:timestamp.slice(0,7),
    artist,
    track,
    album,
    ms,
    uri
  };
}

/* ======================================
   PROGRESSO DA IMPORTAÇÃO
====================================== */

function updateProgress(percent,text) {
  importProgress = Math.max(
    0,
    Math.min(100,Math.round(percent))
  );

  importStatus = text;

  const fill = $("progressFill");
  const label = $("progressText");

  if (fill) {
    fill.style.width = importProgress+"%";
  }

  if (label) {
    label.textContent = importStatus;
  }
}

/* ======================================
   IMPORTAÇÃO ZIP E JSON
====================================== */

async function importHistory(event) {
  if (importing) return;

  const files = Array.from(event.target.files || []);

  if (!files.length) return;

  importing = true;
  importProgress = 0;
  importStatus = "Preparando arquivos...";

  source = "history";
  currentPage = "history";

  render();

  let processedFiles = 0;
  let totalFiles = 0;
  let validRecords = 0;
  let invalidFiles = [];

  try {
    const jsonEntries = [];

    for (const file of files) {
      const filename = file.name.toLowerCase();

      if (filename.endsWith(".zip")) {
        if (typeof JSZip === "undefined") {
          throw new Error(
            "A biblioteca de descompactação não carregou. "+
            "Verifique sua conexão com a internet."
          );
        }

        updateProgress(
          2,
          "Abrindo arquivo ZIP..."
        );

        await sleepFrame();

        const zip = await JSZip.loadAsync(file);

        const entries = Object.values(zip.files)
          .filter(entry => {
            if (entry.dir) return false;

            const name = entry.name.toLowerCase();

            return (
              name.endsWith(".json") &&
              (
                name.includes("streaming_history_audio") ||
                name.includes("audio_") ||
                name.includes("streaminghistory_music")
              )
            );
          });

        for (const entry of entries) {
          jsonEntries.push({
            name:entry.name,
            read:()=>entry.async("string")
          });
        }

      } else if (filename.endsWith(".json")) {
        jsonEntries.push({
          name:file.name,
          read:()=>file.text()
        });
      }
    }

    totalFiles = jsonEntries.length;

    if (!totalFiles) {
      throw new Error(
        "Não encontrei arquivos JSON de histórico musical no ZIP."
      );
    }

    for (const entry of jsonEntries) {
      updateProgress(
        5+(processedFiles/totalFiles)*85,
        "Processando arquivo "+
        (processedFiles+1)+" de "+totalFiles+"..."
      );

      await sleepFrame();

      try {
        const text = await entry.read();
        const parsed = JSON.parse(text);

        if (!Array.isArray(parsed)) {
          invalidFiles.push(entry.name);
          processedFiles++;
          continue;
        }

        const batch = [];
        const batchSize = 2000;

        for (let i=0;i<parsed.length;i++) {
          const record = normalizeRecord(parsed[i]);

          if (record) {
            batch.push(record);
            validRecords++;
          }

          if (batch.length>=batchSize) {
            await saveHistoryBatch(batch);
            batch.length = 0;

            await sleepFrame();
          }
        }

        if (batch.length) {
          await saveHistoryBatch(batch);
        }

      } catch(error) {
        invalidFiles.push(entry.name);
      }

      processedFiles++;

      updateProgress(
        5+(processedFiles/totalFiles)*85,
        "Concluído: "+processedFiles+
        " de "+totalFiles+" arquivos."
      );

      await sleepFrame();
    }

    if (!validRecords) {
      throw new Error(
        "Nenhum registro musical válido foi encontrado."
      );
    }

    updateProgress(
      94,
      "Carregando estatísticas..."
    );

    await sleepFrame();
    await loadHistory();

    const available = availableMonths();

    if (available.length) {
      selectedMonth = available[available.length-1];
      historyYear = Number(selectedMonth.slice(0,4));
    }

    updateProgress(
      100,
      "Importação concluída!"
    );

    importing = false;
    currentPage = "home";
    currentTab = "overview";

    notify(
      number(importedCount)+
      " registros musicais armazenados. "+
      "Histórico pronto para explorar!"+
      (invalidFiles.length
        ? " Alguns arquivos não puderam ser processados."
        : "")
    );

    render();

  } catch(error) {
    importing = false;

    notify(
      "Erro na importação: "+error.message,
      true
    );

    render();

  } finally {
    importing = false;
    event.target.value = "";
  }
}

/* ======================================
   ESTATÍSTICAS
====================================== */

function availableMonths() {
  return [...new Set(
    listeningHistory.map(r => r.month)
  )].sort();
}

function hasRealHistory() {
  return listeningHistory.length > 0;
}

function aggregate(records) {
  const artists = new Map();
  const songs = new Map();

  let totalMs = 0;
  let plays = 0;

  for (const record of records) {
    totalMs += record.ms;
    plays++;

    const artistKey = record.artist;

    if (!artists.has(artistKey)) {
      artists.set(artistKey,{
        name:record.artist,
        ms:0,
        plays:0
      });
    }

    const a = artists.get(artistKey);
    a.ms += record.ms;
    a.plays++;

    const songKey =
      record.uri ||
      record.artist+"\u0000"+record.track;

    if (!songs.has(songKey)) {
      songs.set(songKey,{
        name:record.track,
        artist:record.artist,
        ms:0,
        plays:0
      });
    }

    const s = songs.get(songKey);
    s.ms += record.ms;
    s.plays++;
  }

  return {
    totalMs,
    plays,
    artists:[...artists.values()]
      .sort((a,b)=>b.ms-a.ms),
    songs:[...songs.values()]
      .sort((a,b)=>b.plays-a.plays)
  };
}

function monthlyStats() {
  return aggregate(
    listeningHistory.filter(
      r => r.month === selectedMonth
    )
  );
}

function allStats() {
  return aggregate(listeningHistory);
}

/* ======================================
   RANKINGS VISUAIS
====================================== */

function rankList(items,type,mode) {
  if (!items.length) {
    return `<p class="empty">
      Nenhum dado disponível.
    </p>`;
  }

  return items.slice(0,50).map((item,index) => {
    const isArtist = type === "artist";

    const image = mode === "spotify"
      ? safeImage(
          isArtist
            ? item.images?.[0]?.url
            : item.album?.images?.[0]?.url
        )
      : "";

    const icon = image
      ? `<img src="${image}" alt="">`
      : (isArtist?"🎤":"🎵");

    let detail = "";

    if (mode === "spotify") {
      detail = isArtist
        ? rangeLabel()
        : item.artists?.map(a=>a.name).join(", ");
    } else {
      detail = isArtist
        ? number(minutes(item.ms))+" minutos"
        : item.artist+" · "+
          number(item.plays)+" reproduções";
    }

    return `
      <div class="rank-item">
        <div class="rank-number">${index+1}</div>

        <div class="rank-icon ${isArtist?"":"square"}">
          ${icon}
        </div>

        <div class="rank-info">
          <strong>${escapeHTML(item.name)}</strong>
          <small>${escapeHTML(detail)}</small>
        </div>
      </div>
    `;
  }).join("");
}

function favoriteCard(item,type,mode) {
  const artist = type === "artist";

  const image = mode === "spotify"
    ? safeImage(
        artist
          ? item?.images?.[0]?.url
          : item?.album?.images?.[0]?.url
      )
    : "";

  const visual = image
    ? `<img
         class="favorite-image ${artist?"artist":""}"
         src="${image}"
         alt="">`
    : `<div class="emoji">${artist?"🎤":"🎵"}</div>`;

  return `
    <div class="card favorite"
         onclick="setTab('${artist?"artists":"songs"}')">

      <div class="label">
        ${artist?"Artista favorito":"Música favorita"}
      </div>

      ${visual}

      <strong class="${artist?"blue":"yellow"}">
        ${escapeHTML(item?.name || "Indisponível")}
      </strong>

    </div>
  `;
}

function statsGrid(stats) {
  return `
    <div class="stat-grid">

      <div class="stat">
        <strong>${number(minutes(stats.totalMs))}</strong>
        <span>Minutos ouvidos</span>
      </div>

      <div class="stat">
        <strong>${number(stats.plays)}</strong>
        <span>Reproduções registradas</span>
      </div>

      <div class="stat">
        <strong>${number(stats.artists.length)}</strong>
        <span>Artistas diferentes</span>
      </div>

      <div class="stat">
        <strong>${number(stats.songs.length)}</strong>
        <span>Músicas diferentes</span>
      </div>

    </div>
  `;
}

   VISÃO GERAL SPOTIFY

   VISÃO GERAL HISTÓRICO
====================================== */

function historyOverview() {
  if (!hasRealHistory()) {
    return `
      ${noticeHTML(
        "no_history",
        "Importe seu histórico estendido do Spotify "+
        "para visualizar estatísticas mensais reais."
      )}

      ${importPanel()}

      <div class="card">

          Seu histórico ainda não foi importado.

      ${favoriteCard(

      )}

    <div class="card">
      ${rankList(stats.artists,"artist","history")}
    </div>

/* ======================================
   PAINEL DE IMPORTAÇÃO
====================================== */

function importPanel() {
  return `
    <div class="upload-box">

      <strong>📦 Importar histórico do Spotify</strong>

      <p>
        Selecione o arquivo ZIP original recebido
        do Spotify ou arquivos JSON individuais.
        Seus dados serão processados neste navegador.
      </p>

      <button
        class="upload-btn"
        ${importing?"disabled":""}
        onclick="$('historyFiles').click()">

        ${importing
          ? "Importando..."
          : "Selecionar ZIP ou JSON"}
      </button>

      ${importing ? `
        <div class="progress-container">

          <div class="progress-bar">
            <div
              class="progress-fill"
              id="progressFill"
              style="width:${importProgress}%">
            </div>
          </div>

          <div class="progress-text" id="progressText">
            ${escapeHTML(importStatus)}
          </div>

        </div>
      ` : ""}

    </div>
  `;
}

/* ======================================
   HISTÓRICO MENSAL
====================================== */

function historyPage() {
  const available = availableMonths();

  return `
    <h2>Histórico mensal</h2>

    ${importPanel()}

    ${hasRealHistory()
      ? `<div class="card">

          <div class="label">Histórico importado</div>

          <div class="big-number">
            ${number(importedCount)}
          </div>

          <div>registros musicais armazenados</div>

          <br>

          <button
            class="danger-btn"
            ${importing?"disabled":""}
            onclick="clearHistory()">
            Apagar histórico local
          </button>

        </div>`
      : `<p class="subtitle">
          Ainda não há histórico importado.
        </p>`
    }

    <div class="year-row">
      <button
        class="arrow"
        onclick="changeYear(-1)">‹</button>

      <strong>${historyYear}</strong>

      <button
        class="arrow"
        onclick="changeYear(1)">›</button>
    </div>

    <div class="month-grid">

      ${months.map((month,index)=>{
        const key =
          historyYear+"-"+String(index+1).padStart(2,"0");

        const real = available.includes(key);

        return `
          <button
            class="month-tile ${real?"available":""}"
            onclick="selectMonth('${key}')">

            ${month.slice(0,3)}

            <small>
              ${real?"Disponível":"Sem dados"}
            </small>

          </button>
        `;
      }).join("")}

    </div>
  `;
}

/* ======================================
   TODO O PERÍODO
====================================== */

function allPeriodPage() {
  if (!hasRealHistory()) {
    return `
      <h2>Todo o período ♾️</h2>

      ${importPanel()}

      <div class="card">
        <p class="empty">
          Importe seu histórico para visualizar
          o total de minutos, reproduções,
          artistas e músicas de todos os anos.
        </p>
      </div>
    `;
  }

  const stats = allStats();
  const available = availableMonths();

  return `
    <h2>Todo o período ♾️</h2>

    <p class="subtitle">
      Dados de ${escapeHTML(monthName(available[0]))}
      até ${escapeHTML(monthName(available[available.length-1]))}.
    </p>

    ${statsGrid(stats)}

    <div class="grid">
      ${favoriteCard(
        stats.artists[0],"artist","history"
      )}

      ${favoriteCard(
        stats.songs[0],"song","history"
      )}
    </div>

    <h2>Artistas de todo o período</h2>
    <div class="card">
      ${rankList(stats.artists,"artist","history")}
    </div>

    <h2>Músicas de todo o período</h2>
    <div class="card">
      ${rankList(stats.songs,"song","history")}
    </div>
  `;
}

/* ======================================
   NAVEGAÇÃO
====================================== */

function setPage(page) {
  currentPage = page;
  currentTab = "overview";

  render();

  window.scrollTo({top:0,behavior:"smooth"});
}

function setTab(tab) {
  currentTab = tab;
  render();
}

function setSource(next) {
  if (next==="spotify" && !auth) {
    notify("Conecte sua conta Spotify primeiro.",true);
    return;
  }

  source = next;
  currentPage = "home";
  currentTab = "overview";

  render();

  if (source==="spotify") {
    loadSpotifyData();
  }
}

function setRange(next) {
  range = next;
  currentTab = "overview";

  spotifyArtists = [];
  spotifySongs = [];

  render();
  loadSpotifyData();
}

function changeMonth(delta) {
  const [year,month] =
    selectedMonth.split("-").map(Number);

  const date = new Date(
    Date.UTC(year,month-1+delta,1)
  );

  selectedMonth = date.toISOString().slice(0,7);
  historyYear = date.getUTCFullYear();

  render();
}

function changeYear(delta) {
  historyYear += delta;
  render();
}

function selectMonth(key) {
  selectedMonth = key;
  historyYear = Number(key.slice(0,4));

  source = "history";
  currentPage = "home";
  currentTab = "overview";

  render();
}

function renderControls() {
  if (currentPage!=="home") return "";

  let html = `
    <div class="mode-switch">

      <button
        class="pill ${source==="history"?"active":""}"
        onclick="setSource('history')">
        📅 Histórico
      </button>

      <button
        class="pill ${source==="spotify"?"active":""}"
        onclick="setSource('spotify')">
        🟢 Spotify API
      </button>

    </div>
  `;

  if (source==="spotify") {
    html += `
      <div class="mode-switch">

        <button
          class="pill ${range==="short_term"?"active":""}"
          onclick="setRange('short_term')">
          4 semanas
        </button>

        <button
          class="pill ${range==="medium_term"?"active":""}"
          onclick="setRange('medium_term')">
          6 meses
        </button>

        <button
          class="pill ${range==="long_term"?"active":""}"
          onclick="setRange('long_term')">
          Longo prazo
        </button>

      </div>
    `;
  }

  return html;
}

function renderBottomNav() {
  const pages = source==="spotify"
    ? [
        ["home","⌂","Início"]
      ]
    : [
        ["home","⌂","Início"],
        ["history","▦","Histórico"],
        ["all","∞","Todo o período"]
      ];

  $("bottomNav").innerHTML = pages.map(
    ([page,icon,label])=>`
      <button
        class="${currentPage===page?"active":""}"
        onclick="setPage('${page}')">

        <span class="icon">${icon}</span>
        ${label}

      </button>
    `
  ).join("");
}

/* ======================================
   RENDERIZAÇÃO
====================================== */

function render() {
  $("connectBtn").classList.toggle(
    "hidden",
    !!auth
  );

  $("disconnectBtn").classList.toggle(
    "hidden",
    !auth
  );

  $("authStatus").textContent = auth
    ? "Spotify conectado ✓"
    : "Modo histórico";

  if (source==="spotify" && currentPage!=="home") {
    currentPage = "home";
  }

  $("controls").innerHTML = renderControls();

  const showMonth =
    source==="history" &&
    currentPage==="home";

  $("monthSelector").classList.toggle(
    "hidden",
    !showMonth
  );

  $("monthTitle").textContent =
    monthName(selectedMonth);

  const showTabs = currentPage==="home";

  $("tabs").classList.toggle(
    "hidden",
    !showTabs
  );

  document.querySelectorAll(
    "#tabs button"
  ).forEach(button=>{
    button.classList.toggle(
      "active",
      button.dataset.tab===currentTab
    );
  });

  renderBottomNav();
  renderMessages();

  if (currentPage==="history") {
    $("content").innerHTML = historyPage();
    return;
  }

  if (currentPage==="all") {
    $("content").innerHTML = allPeriodPage();
    return;
  }

  if (source==="spotify") {
    if (currentTab==="overview") {
      $("content").innerHTML = spotifyOverview();

    } else if (currentTab==="artists") {
      $("content").innerHTML = `
        <h2>Artistas mais ouvidos</h2>
        <div class="card">
          ${rankList(spotifyArtists,"artist","spotify")}
        </div>
      `;

    } else {
      $("content").innerHTML = `
        <h2>Músicas mais ouvidas</h2>
        <div class="card">
          ${rankList(spotifySongs,"song","spotify")}
        </div>
      `;
    }

    return;
  }

  if (currentTab==="overview") {
    $("content").innerHTML = historyOverview();
    return;
  }

  if (!hasRealHistory()) {
    $("content").innerHTML = `
      <div class="card">
        <p class="empty">
          Importe seu histórico para visualizar
          rankings mensais reais.
        </p>
      </div>
    `;
    return;
  }

  const stats = monthlyStats();

  if (currentTab==="artists") {
    $("content").innerHTML = `
      <h2>Artistas — ${escapeHTML(monthName(selectedMonth))}</h2>
      <div class="card">
        ${rankList(stats.artists,"artist","history")}
      </div>
    `;

  } else {
    $("content").innerHTML = `
      <h2>Músicas — ${escapeHTML(monthName(selectedMonth))}</h2>
      <div class="card">
        ${rankList(stats.songs,"song","history")}
      </div>
    `;
  }
}

/* ======================================
   INICIALIZAÇÃO
====================================== */

async function initialize() {
  render();

  try {
    await loadHistory();

    const available = availableMonths();

    if (available.length) {
      selectedMonth = available[available.length-1];
      historyYear = Number(selectedMonth.slice(0,4));
    }

  } catch(error) {
    notify(
      "Não foi possível abrir o histórico local: "+
      error.message,
      true
    );
  }

  await handleCallback();

  render();

  if (auth) {
    source = "spotify";
    render();
    await loadSpotifyData();
  }
}

initialize();
